toolchain:
  name: "texconv"
  description: "Microsoft DirectXTex texconv for texture conversion to DDS"
  
  target:
    platform: any
    architecture: any
  
  host:
    platform: windows
    architecture: x86_64
  
  execution:
    type: native
  
  tools:
    # Texture compression/conversion
    convert:
      action: convert
      command: "texconv {flags} {input} -o {output_dir} -y"
      input_extensions: [".png", ".jpg", ".jpeg", ".tga", ".bmp", ".dds", ".hdr", ".exr"]
      output_extension: ".dds"
      flags:
        common: ["-f", "BC7_UNORM"]
        debug: ["-f", "BC7_UNORM"]
        release: ["-f", "BC7_UNORM"]
      supports:
        defines: false
        includes: false
