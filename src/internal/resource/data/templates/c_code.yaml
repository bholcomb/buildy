# C Build Templates
# Templates for building C libraries and executables

templates:
  # C Shared library: compile sources with PIC, link into shared library
  c_shared_library:
    description: "Compile C sources and link into shared library (.so, .dll, .dylib)"
    metadata:
      language: c
      target_types: [shared_library]
      toolchain_language: c
      pre_processing:
        resolve_packages: true
        resolve_sources: true
        resolve_include_dirs: true
        resolve_path: false
      post_processing:
        scan_sources_pattern: ""
        register_target: true
        add_setup_dependency: false
    steps:
      - name: compile
        action: compile
        for_each: source
        output: "{output_dir}/obj/{module}/{source_stem}{tool.output_ext}"
        inputs: ["{source}"]
        tool_params:
          defines: "{config.defines}"
          include_dirs: "{item.include_dirs}"
          extra_flags: "{config.compiler_flags}"
          is_shared_library: true
      
      - name: link
        action: link
        output_type: shared_library
        output: "{output_dir}/lib/{tool.output_pattern}"
        inputs: "{compile.outputs}"
        depends_on: ["{compile.task_ids}"]
        tool_params:
          lib_dirs: []
          libs: []
  
  # C Static library: compile sources, archive into static library
  c_static_library:
    description: "Compile C sources and archive into static library (.a, .lib)"
    metadata:
      language: c
      target_types: [static_library]
      toolchain_language: c
      pre_processing:
        resolve_packages: true
        resolve_sources: true
        resolve_include_dirs: true
        resolve_path: false
      post_processing:
        scan_sources_pattern: ""
        register_target: true
        add_setup_dependency: false
    steps:
      - name: compile
        action: compile
        for_each: source
        output: "{output_dir}/obj/{module}/{source_stem}{tool.output_ext}"
        inputs: ["{source}"]
        tool_params:
          defines: "{config.defines}"
          include_dirs: "{item.include_dirs}"
          extra_flags: "{config.compiler_flags}"
          is_shared_library: false
      
      - name: link
        action: link
        output_type: static_library
        output: "{output_dir}/lib/{tool.output_pattern}"
        inputs: "{compile.outputs}"
        depends_on: ["{compile.task_ids}"]
        tool_params:
          lib_dirs: []
          libs: []
  
  # C Executable: compile sources, link with libraries into executable
  c_executable:
    description: "Compile C sources and link into executable"
    metadata:
      language: c
      target_types: [executable]
      toolchain_language: c
      pre_processing:
        resolve_packages: true
        resolve_sources: true
        resolve_include_dirs: true
        resolve_path: false
      post_processing:
        scan_sources_pattern: ""
        register_target: false
        add_setup_dependency: false
    steps:
      - name: compile
        action: compile
        for_each: source
        output: "{output_dir}/obj/{module}/{source_stem}{tool.output_ext}"
        inputs: ["{source}"]
        tool_params:
          defines: "{config.defines}"
          include_dirs: "{item.include_dirs}"
          extra_flags: "{config.compiler_flags}"
          is_shared_library: false
      
      - name: link
        action: link
        output_type: executable
        output: "{output_dir}/bin/{tool.output_pattern}"
        inputs: "{compile.outputs}"
        depends_on: ["{compile.task_ids}", "{item.depends_on.link_tasks}"]
        tool_params:
          lib_dirs: ["{output_dir}/lib", "{item.lib_dirs}"]
          libs: "{item.libs}"
          frameworks: "{item.frameworks}"
