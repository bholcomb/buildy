# Rust Build Templates
# Templates for building Rust executables and libraries with Cargo

templates:
  # Rust executable: single-step build (Cargo handles compilation internally)
  rust_executable:
    description: "Build Rust executable"
    metadata:
      language: rust
      target_types: [executable]
      toolchain_language: rust
      pre_processing:
        resolve_packages: false
        resolve_sources: false
        resolve_include_dirs: false
        resolve_path: true
      post_processing:
        scan_sources_pattern: "*.rs"
        register_target: true
        add_setup_dependency: true
    steps:
      - name: build
        action: build
        output: "{output_dir}/{config}/bin/{tool.output_pattern}"
        inputs: ["{item.path}"]
        working_dir: "{item.path}"
        tool_params:
          features: "{item.features}"
          bin: "{item.bin}"

  # Rust library crate
  rust_library:
    description: "Build Rust library"
    metadata:
      language: rust
      target_types: [library, static_library, shared_library]
      toolchain_language: rust
      pre_processing:
        resolve_packages: false
        resolve_sources: false
        resolve_include_dirs: false
        resolve_path: true
      post_processing:
        scan_sources_pattern: "*.rs"
        register_target: true
        add_setup_dependency: true
    steps:
      - name: build
        action: build
        output: "{output_dir}/{config}/lib/{tool.output_pattern}"
        inputs: ["{item.path}"]
        working_dir: "{item.path}"
        tool_params:
          features: "{item.features}"
          lib: true
