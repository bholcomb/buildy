# Rust Build Templates
# Templates for building Rust executables and C-compatible libraries with Cargo
#
# Note: For pure Rust projects, dependencies are handled by Cargo and you
# typically only need executables. The library templates are for C/C++ interop:
# - static_libraries: produces .a files (staticlib crate type)
# - shared_libraries: produces .so/.dll files (cdylib crate type)

templates:
  # Rust executable: single-step build (Cargo handles compilation internally)
  rust_executable:
    description: "Build Rust executable"
    metadata:
      language: rust
      target_types: [executable]
      toolchain_language: rust
      # cargo build keeps its own content-based cache: buildy always runs it
      tool_cached: true
      pre_processing:
        resolve_deps: false
        resolve_sources: false
        resolve_include_dirs: false
        resolve_path: true
      post_processing:
        register_target: true
    steps:
      - name: build
        action: build
        output: "${output_dir}/cargo/${cargo_triple_dir}${profile}/${bin_name}${exe_ext}"
        inputs: ["${item.path}"]
        working_dir: "${item.path}"

  # Rust static library: C-compatible static library (staticlib)
  # Use this for linking into C/C++ projects
  rust_static_library:
    description: "Build Rust static library for C interop"
    metadata:
      language: rust
      target_types: [static_library]
      toolchain_language: rust
      # cargo build keeps its own content-based cache: buildy always runs it
      tool_cached: true
      pre_processing:
        resolve_deps: false
        resolve_sources: false
        resolve_include_dirs: false
        resolve_path: true
      post_processing:
        register_target: true
    steps:
      - name: build
        action: build
        output: "${output_dir}/cargo/${cargo_triple_dir}${profile}/${staticlib_name}"
        inputs: ["${item.path}"]
        working_dir: "${item.path}"
        tool_params:
          crate_type: "staticlib"

  # Rust shared library: C-compatible dynamic library (cdylib)
  # Use this for creating .so/.dll for C interop
  rust_shared_library:
    description: "Build Rust shared library for C interop"
    metadata:
      language: rust
      target_types: [shared_library]
      toolchain_language: rust
      # cargo build keeps its own content-based cache: buildy always runs it
      tool_cached: true
      pre_processing:
        resolve_deps: false
        resolve_sources: false
        resolve_include_dirs: false
        resolve_path: true
      post_processing:
        register_target: true
    steps:
      - name: build
        action: build
        output: "${output_dir}/cargo/${cargo_triple_dir}${profile}/${cdylib_name}"
        inputs: ["${item.path}"]
        working_dir: "${item.path}"
        tool_params:
          crate_type: "cdylib"
