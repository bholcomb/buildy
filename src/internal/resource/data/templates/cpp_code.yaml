# C/C++ Build Templates
# Templates for building libraries and executables

templates:
  # Shared library: compile sources with PIC, link into shared library
  shared_library:
    description: "Compile sources and link into shared library (.so, .dll, .dylib)"
    steps:
      - name: compile
        action: compile
        for_each: source
        output: "{output_dir}/obj/{module}/{source_stem}{tool.output_ext}"
        inputs: ["{source}"]
        tool_params:
          defines: "{config.defines}"
          include_dirs: "{item.include_dirs}"
          extra_flags: "{config.compiler_flags}"
          is_shared_library: true
          std: "{config.cpp_standard}"
      
      - name: link
        action: link
        output_type: shared_library
        output: "{output_dir}/lib/{tool.output_pattern}"
        inputs: "{compile.outputs}"
        depends_on: ["{compile.task_ids}"]
        tool_params:
          lib_dirs: []
          libs: []
  
  # Static library: compile sources, archive into static library
  static_library:
    description: "Compile sources and archive into static library (.a, .lib)"
    steps:
      - name: compile
        action: compile
        for_each: source
        output: "{output_dir}/obj/{module}/{source_stem}{tool.output_ext}"
        inputs: ["{source}"]
        tool_params:
          defines: "{config.defines}"
          include_dirs: "{item.include_dirs}"
          extra_flags: "{config.compiler_flags}"
          is_shared_library: false
          std: "{config.cpp_standard}"
      
      - name: link
        action: link
        output_type: static_library
        output: "{output_dir}/lib/{tool.output_pattern}"
        inputs: "{compile.outputs}"
        depends_on: ["{compile.task_ids}"]
        tool_params:
          lib_dirs: []
          libs: []
  
  # Executable: compile sources, link with libraries into executable
  executable:
    description: "Compile sources and link into executable"
    steps:
      - name: compile
        action: compile
        for_each: source
        output: "{output_dir}/obj/{module}/{source_stem}{tool.output_ext}"
        inputs: ["{source}"]
        tool_params:
          defines: "{config.defines}"
          include_dirs: "{item.include_dirs}"
          extra_flags: "{config.compiler_flags}"
          is_shared_library: false
          std: "{config.cpp_standard}"
      
      - name: link
        action: link
        output_type: executable
        output: "{output_dir}/bin/{tool.output_pattern}"
        inputs: "{compile.outputs}"
        depends_on: ["{compile.task_ids}", "{item.depends_on.link_tasks}"]
        tool_params:
          lib_dirs: ["{output_dir}/lib", "{item.lib_dirs}"]
          libs: "{item.libs}"
          frameworks: "{item.frameworks}"
