# Go Build Templates
# Templates for building Go executables and C-compatible shared libraries
#
# Note: Go doesn't support traditional static libraries. Go packages are
# compiled directly into the final binary. For C interop, use shared_libraries
# with buildmode=c-shared.

templates:
  # Go executable: single-step build (Go handles its own compilation internally)
  go_executable:
    description: "Build Go executable"
    metadata:
      language: go
      target_types: [executable]
      toolchain_language: go
      pre_processing:
        resolve_deps: false
        resolve_sources: false
        resolve_include_dirs: false
        resolve_path: true
      post_processing:
        scan_sources_pattern: "*.go"
        register_target: true
        add_setup_dependency: true
    steps:
      - name: build
        action: build
        output: "${output_dir}/bin/${tool.output_pattern}"
        inputs: ["${item.path}"]
        working_dir: "${item.path}"
        tool_params:
          build_tags: "${item.build_tags}"
          ldflags: "${item.ldflags}"

  # Go shared library: C-compatible shared library using buildmode=c-shared
  # Use this for C/C++ interop - exports functions with //export directives
  go_shared_library:
    description: "Build Go C-compatible shared library"
    metadata:
      language: go
      target_types: [shared_library]
      toolchain_language: go
      pre_processing:
        resolve_deps: false
        resolve_sources: false
        resolve_include_dirs: false
        resolve_path: true
      post_processing:
        scan_sources_pattern: "*.go"
        register_target: true
        add_setup_dependency: true
    steps:
      - name: build
        action: build
        output: "${output_dir}/lib/${tool.output_pattern}"
        inputs: ["${item.path}"]
        working_dir: "${item.path}"
        tool_params:
          build_tags: "${item.build_tags}"
          ldflags: "${item.ldflags}"
          buildmode: "c-shared"
