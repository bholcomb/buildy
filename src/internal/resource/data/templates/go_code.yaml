# Go Build Templates
# Templates for building Go executables and libraries

templates:
  # Go executable: single-step build (Go handles its own compilation internally)
  go_executable:
    description: "Build Go executable"
    metadata:
      language: go
      target_types: [executable]
      toolchain_language: go
      pre_processing:
        resolve_packages: false
        resolve_sources: false
        resolve_include_dirs: false
        resolve_path: true
      post_processing:
        scan_sources_pattern: "*.go"
        register_target: true
        add_setup_dependency: true
    steps:
      - name: build
        action: build
        output: "{output_dir}/bin/{tool.output_pattern}"
        inputs: ["{item.path}"]
        working_dir: "{item.path}"
        tool_params:
          build_tags: "{item.build_tags}"
          ldflags: "{item.ldflags}"

  # Go library (plugin): single-step build with -buildmode=plugin
  go_library:
    description: "Build Go plugin/library"
    metadata:
      language: go
      target_types: [library, shared_library, plugin]
      toolchain_language: go
      pre_processing:
        resolve_packages: false
        resolve_sources: false
        resolve_include_dirs: false
        resolve_path: true
      post_processing:
        scan_sources_pattern: "*.go"
        register_target: true
        add_setup_dependency: true
    steps:
      - name: build
        action: build
        output: "{output_dir}/lib/{tool.output_pattern}"
        inputs: ["{item.path}"]
        working_dir: "{item.path}"
        tool_params:
          build_tags: "{item.build_tags}"
          ldflags: "{item.ldflags}"
          buildmode: "plugin"
