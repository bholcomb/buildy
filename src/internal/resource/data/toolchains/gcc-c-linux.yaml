toolchain:
  name: "gcc-c-linux"
  description: "GCC C compiler for Linux x86_64"
  language: c
  
  target:
    platform: linux
    architecture: x86_64
  
  host:
    platform: linux
    architecture: x86_64
  
  execution:
    type: native
  
  flag_mappings:
    optimization:
      none: ["-O0"]
      size: ["-Os"]
      speed: ["-O2"]
      full: ["-O3"]
    warnings:
      off: []
      default: ["-Wall"]
      extra: ["-Wall", "-Wextra"]
      everything: ["-Wall", "-Wextra", "-Wpedantic"]
    symbols:
      "true": ["-g"]
      "false": []
    runtime:
      debug: []
      release: []

  output_prefix: "lib"

  tools:
    # C compilation
    c_compile:
      action: compile
      command: "gcc ${dep_flags} -std=${std} ${flags} ${defines} ${pic} ${includes} -c ${input} -o ${output}"
      input_extensions: [".c"]
      output_extension: ".o"
      flags:
        common: []
        debug: []
        release: []
      supports:
        defines: true
        define_flag: "-D"
        includes: true
        include_flag: "-I"
        pic: true
        pic_flag: "-fPIC"
        dependencies: "-MMD -MP -MF ${dep_file}"
        std: true
    
    # Shared library linking
    link_shared_library:
      action: link
      command: "gcc -shared ${flags} ${objects} ${lib_dirs} ${libs} ${frameworks} -o ${output}"
      input_extensions: [".o"]
      output_extension: ".so"
      output_pattern: "${output_prefix}${name}.so"
      flags:
        common: ["-Wl,-rpath,'$ORIGIN'"]
        debug: []
        release: []
      supports:
        output_type: "shared_library"
        lib_dirs: true
        lib_dir_flag: "-L"
        libs: true
        lib_flag: "-l"
        frameworks: false
    
    # Static library archiving
    link_static_library:
      action: link
      command: "ar rcs ${output} ${objects}"
      input_extensions: [".o"]
      output_extension: ".a"
      output_pattern: "${output_prefix}${name}.a"
      flags:
        common: []
        debug: []
        release: []
      supports:
        output_type: "static_library"
        lib_dirs: false
        libs: false
    
    # Executable linking
    link_executable:
      action: link
      command: "gcc ${flags} ${objects} ${lib_dirs} ${libs} ${frameworks} -o ${output}"
      input_extensions: [".o"]
      output_extension: ""
      output_pattern: "${name}"
      flags:
        common: ["-Wl,-rpath,'$ORIGIN'"]
        debug: []
        release: []
      supports:
        output_type: "executable"
        lib_dirs: true
        lib_dir_flag: "-L"
        libs: true
        lib_flag: "-l"
        frameworks: false
