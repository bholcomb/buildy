# Rust Toolchain for macOS ARM64 (Apple Silicon)

toolchain:
  name: "rust-macos-arm64"
  description: "Rust compiler for macOS ARM64 (Apple Silicon)"
  language: "rust"
  
  target:
    platform: macos
    architecture: arm64
  
  host:
    platform: macos
    architecture: arm64
  
  execution:
    type: native

  output_prefix: ""

  # Where Cargo puts this toolchain's artifacts, under the --target-dir: the Rust templates'
  # outputs are ${output_dir}/cargo/${cargo_triple_dir}${profile}/<file>.
  variables:
    cargo_triple_dir: ""
    exe_ext: ""
    staticlib_name: "lib${item.name}.a"
    cdylib_name: "lib${item.name}.dylib"

  tools:
    cargo_build:
      action: build
      command: "cargo build ${release_flag} ${lib_flag} --target-dir ${output_dir}/cargo ${features} ${bin_flag}"
      input_extensions: [".rs"]
      output_extension: ""
      output_pattern: "${name}"
      flags:
        common: []
        debug: []
        release: ["--release"]
      
      command_params:
        # Cargo's profile directory: release when the configuration's flags pass --release
        profile:
          sources: ["tool.flags.${config}"]
          match: "--release"
          format: "release"
          default: "debug"
        # The executable's name: bin: if set, else the target's name
        bin_name:
          sources: ["tool_params.bin", "item.bin", "item.name"]
          format: "${value}"
        release_flag:
          sources: ["tool.flags.${config}"]
          match: "--release"
          format: "${value}"
          optional: true
        lib_flag:
          sources: ["tool_params.crate_type"]
          format: "--lib"
          optional: true
        features:
          sources: ["tool_params.features", "item.features"]
          format: "--features ${value}"
          join: ","
          optional: true
        bin_flag:
          sources: ["tool_params.bin", "item.bin"]
          format: "--bin ${value}"
          optional: true
      
      
      supports:
        features: true
        features_flag: "--features"
        all_features: true
        all_features_flag: "--all-features"
        no_default_features: true
        no_default_features_flag: "--no-default-features"
