toolchain:
  name: "docker-cpp-linux"
  description: "GCC C++ in Docker for cross-platform builds"
  language: cpp
  
  target:
    platform: linux
    architecture: x86_64
  
  host:
    platform: any
    architecture: any
  
  execution:
    type: docker
    image: "gcc:13"
    volumes:
      - "${PWD}:/workspace"
    working_dir: "/workspace"
    user: "${UID}:${GID}"
  
  tools:
    # C compilation
    c_compile:
      action: compile
      command: "gcc ${dep_flags} ${flags} ${defines} ${pic} ${includes} -c ${input} -o ${output}"
      input_extensions: [".c"]
      output_extension: ".o"
      flags:
        common: ["-Wall", "-Wextra"]
        debug: ["-g", "-O0"]
        release: ["-O3", "-DNDEBUG"]
      supports:
        defines: true
        define_flag: "-D"
        includes: true
        include_flag: "-I"
        pic: true
        pic_flag: "-fPIC"
        dependencies: "-MMD -MP -MF ${dep_file}"
    
    # C++ compilation
    cpp_compile:
      action: compile
      command: "g++ ${dep_flags} -std=${std} ${flags} ${defines} ${pic} ${includes} -c ${input} -o ${output}"
      input_extensions: [".cpp", ".cc", ".cxx", ".C"]
      output_extension: ".o"
      flags:
        common: ["-Wall", "-Wextra"]
        debug: ["-g", "-O0"]
        release: ["-O3", "-DNDEBUG"]
      supports:
        defines: true
        define_flag: "-D"
        includes: true
        include_flag: "-I"
        pic: true
        pic_flag: "-fPIC"
        dependencies: "-MMD -MP -MF ${dep_file}"
        std: true
    
    # Shared library linking
    link_shared_library:
      action: link
      command: "g++ -shared ${flags} ${objects} ${lib_dirs} ${libs} -o ${output}"
      input_extensions: [".o"]
      output_extension: ".so"
      output_pattern: "lib${name}.so"
      flags:
        common: []
        debug: []
        release: ["-s"]
      supports:
        output_type: "shared_library"
        lib_dirs: true
        lib_dir_flag: "-L"
        libs: true
        lib_flag: "-l"
    
    # Static library archiving
    link_static_library:
      action: link
      command: "ar rcs ${output} ${objects}"
      input_extensions: [".o"]
      output_extension: ".a"
      output_pattern: "lib${name}.a"
      flags:
        common: []
        debug: []
        release: []
      supports:
        output_type: "static_library"
        lib_dirs: false
        libs: false
    
    # Executable linking
    link_executable:
      action: link
      command: "g++ ${flags} ${objects} ${lib_dirs} ${libs} -o ${output}"
      input_extensions: [".o"]
      output_extension: ""
      output_pattern: "${name}"
      flags:
        common: []
        debug: []
        release: ["-s"]
      supports:
        output_type: "executable"
        lib_dirs: true
        lib_dir_flag: "-L"
        libs: true
        lib_flag: "-l"
