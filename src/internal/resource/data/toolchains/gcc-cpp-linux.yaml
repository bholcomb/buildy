toolchain:
  name: "gcc-cpp-linux"
  description: "GCC C++ compiler for Linux x86_64"
  language: cpp
  
  target:
    platform: linux
    architecture: x86_64

  # Of the toolchains for a platform and architecture, the one with the highest priority is the
  # default (buildy picks it when a config names none).
  priority: 40
  
  host:
    platform: linux
    architecture: x86_64
  
  execution:
    type: native

  # Environment variables the tools read: their values are part of every task's cache key, so
  # changing one rebuilds what it affects.
  reads_env: [CPATH, C_INCLUDE_PATH, CPLUS_INCLUDE_PATH, OBJC_INCLUDE_PATH, LIBRARY_PATH, COMPILER_PATH, GCC_EXEC_PREFIX, LD_RUN_PATH, SOURCE_DATE_EPOCH]
  
  flag_mappings:
    optimization:
      none: ["-O0"]
      size: ["-Os"]
      speed: ["-O2"]
      full: ["-O3"]
    warnings:
      off: []
      default: ["-Wall"]
      extra: ["-Wall", "-Wextra"]
      everything: ["-Wall", "-Wextra", "-Wpedantic"]
    symbols:
      "true": ["-g"]
      "false": []
    runtime:
      debug: []
      release: []

  output_prefix: "lib"

  tools:
    # C compilation
    c_compile:
      action: compile
      command: "gcc ${dep_flags} ${flags} ${defines} ${pic} ${includes} -c ${input} -o ${output}"
      response_file: gnu
      input_extensions: [".c"]
      output_extension: ".o"
      flags:
        common: []
        debug: []
        release: []
      supports:
        defines: true
        define_flag: "-D"
        includes: true
        include_flag: "-I"
        pic: true
        pic_flag: "-fPIC"
        dependencies: "-MMD -MP -MF ${dep_file}"
    
    # C++ compilation
    cpp_compile:
      action: compile
      command: "g++ ${dep_flags} ${std_flags} ${flags} ${defines} ${pic} ${includes} -c ${input} -o ${output}"
      response_file: gnu
      input_extensions: [".cpp", ".cc", ".cxx", ".C"]
      output_extension: ".o"
      flags:
        common: []
        debug: []
        release: []
      supports:
        defines: true
        define_flag: "-D"
        includes: true
        include_flag: "-I"
        pic: true
        pic_flag: "-fPIC"
        dependencies: "-MMD -MP -MF ${dep_file}"
        std: true
    
    # Shared library linking
    link_shared_library:
      action: link
      command: "g++ -shared ${flags} ${objects} ${lib_dirs} ${libs} ${frameworks} -o ${output}"
      response_file: gnu
      input_extensions: [".o"]
      output_extension: ".so"
      output_pattern: "${output_prefix}${name}.so"
      flags:
        common: ["-Wl,-rpath,$ORIGIN"]
        debug: []
        release: []
      supports:
        output_type: "shared_library"
        lib_dirs: true
        lib_dir_flag: "-L"
        libs: true
        lib_flag: "-l"
        frameworks: false
    
    # Static library archiving
    link_static_library:
      action: link
      command: "ar rcs ${output} ${objects}"
      response_file: gnu
      input_extensions: [".o"]
      output_extension: ".a"
      output_pattern: "${output_prefix}${name}.a"
      flags:
        common: []
        debug: []
        release: []
      supports:
        output_type: "static_library"
        lib_dirs: false
        libs: false
    
    # Executable linking
    link_executable:
      action: link
      command: "g++ ${flags} ${objects} ${lib_dirs} ${libs} ${frameworks} -o ${output}"
      response_file: gnu
      input_extensions: [".o"]
      output_extension: ""
      output_pattern: "${name}"
      flags:
        common: ["-Wl,-rpath,$ORIGIN"]
        debug: []
        release: []
      supports:
        output_type: "executable"
        lib_dirs: true
        lib_dir_flag: "-L"
        libs: true
        lib_flag: "-l"
        frameworks: false
