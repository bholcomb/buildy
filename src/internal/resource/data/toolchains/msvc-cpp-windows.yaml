toolchain:
  name: "msvc-cpp-windows"
  description: "Microsoft Visual C++ for Windows x86_64"
  language: cpp
  
  target:
    platform: windows
    architecture: x86_64
  
  host:
    platform: windows
    architecture: x86_64
  
  execution:
    type: native
  
  tools:
    # C compilation
    c_compile:
      action: compile
      command: "cl.exe ${dep_flags} ${flags} ${defines} ${includes} /c ${input} /Fo${output}"
      input_extensions: [".c"]
      output_extension: ".obj"
      flags:
        common: ["/W4", "/nologo"]
        debug: ["/Od", "/Zi", "/FS", "/MDd"]
        release: ["/O2", "/MD", "/DNDEBUG"]
      supports:
        defines: true
        define_flag: "/D"
        includes: true
        include_flag: "/I"
        pic: false
        dependencies: "/sourceDependencies ${dep_file}"
    
    # C++ compilation
    cpp_compile:
      action: compile
      command: "cl.exe ${dep_flags} /std:${std} ${flags} ${defines} ${includes} /c ${input} /Fo${output}"
      input_extensions: [".cpp", ".cc", ".cxx", ".C"]
      output_extension: ".obj"
      flags:
        common: ["/W4", "/nologo", "/EHsc"]
        debug: ["/Od", "/Zi", "/FS", "/MDd"]
        release: ["/O2", "/MD", "/DNDEBUG"]
      supports:
        defines: true
        define_flag: "/D"
        includes: true
        include_flag: "/I"
        pic: false
        dependencies: "/sourceDependencies ${dep_file}"
        std: true
    
    # Shared library linking (DLL)
    link_shared_library:
      action: link
      command: "link.exe /DLL ${flags} ${objects} ${lib_dirs} ${libs} /OUT:${output} /IMPLIB:${implib}"
      input_extensions: [".obj"]
      output_extension: ".dll"
      output_pattern: "${name}.dll"
      flags:
        common: ["/nologo"]
        debug: ["/DEBUG"]
        release: []
      supports:
        output_type: "shared_library"
        lib_dirs: true
        lib_dir_flag: "/LIBPATH:"
        libs: true
        lib_flag: ""
        lib_suffix: ".lib"
        implib: true
    
    # Static library archiving
    link_static_library:
      action: link
      command: "lib.exe ${flags} ${objects} /OUT:${output}"
      input_extensions: [".obj"]
      output_extension: ".lib"
      output_pattern: "${name}.lib"
      flags:
        common: ["/nologo"]
        debug: []
        release: []
      supports:
        output_type: "static_library"
        lib_dirs: false
        libs: false
    
    # Executable linking
    link_executable:
      action: link
      command: "link.exe ${flags} ${objects} ${lib_dirs} ${libs} /OUT:${output}"
      input_extensions: [".obj"]
      output_extension: ".exe"
      output_pattern: "${name}.exe"
      flags:
        common: ["/nologo"]
        debug: ["/DEBUG"]
        release: []
      supports:
        output_type: "executable"
        lib_dirs: true
        lib_dir_flag: "/LIBPATH:"
        libs: true
        lib_flag: ""
        lib_suffix: ".lib"
