# Go Toolchain for Linux x86_64

toolchain:
  name: "go-linux"
  description: "Go compiler for Linux"
  language: "go"
  
  target:
    platform: linux
    architecture: x86_64
  
  host:
    platform: linux
    architecture: x86_64
  
  execution:
    type: native

  output_prefix: ""

  tools:
    go_build:
      action: build
      command: "go build ${buildmode} ${flags} -o ${output} ${build_tags} ${ldflags} ${gcflags} ${input}"
      input_extensions: [".go"]
      output_extension: ""
      output_pattern: "${name}"
      flags:
        common: []
        debug: []
        release: ["-trimpath"]
      
      # Data-driven command parameter definitions
      command_params:
        buildmode:
          sources: ["tool_params.buildmode", "item.buildmode"]
          format: "-buildmode=${value}"
          optional: true
        build_tags:
          sources: ["tool_params.build_tags", "item.build_tags"]
          format: "-tags ${value}"
          join: ","
          optional: true
        ldflags:
          sources: ["tool_params.ldflags", "item.ldflags"]
          format: "-ldflags \"${value}\""
          join: " "
          resolve_variables: true
          optional: true
        gcflags:
          sources: ["tool_params.gcflags", "item.gcflags"]
          format: "-gcflags=${value}"
          optional: true
      
      # Files to track for cache invalidation
      manifest_files:
        - "go.mod"
        - "go.sum"
      
      supports:
        build_tags: true
        build_tags_flag: "-tags"
        ldflags: true
        ldflags_flag: "-ldflags"
        gcflags: true
        gcflags_flag: "-gcflags"
        trimpath: true
        trimpath_flag: "-trimpath"
        buildmode: true
        buildmode_flag: "-buildmode"
