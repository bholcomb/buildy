toolchain:
  name: "emscripten"
  description: "Emscripten for WebAssembly compilation"
  language: "c++"
  
  target:
    platform: wasm
    architecture: wasm32
  
  host:
    platform: any
    architecture: any
  
  execution:
    type: native
  
  tools:
    # C compilation
    c_compile:
      action: compile
      command: "emcc {dep_flags} {flags} {defines} {includes} -c {input} -o {output}"
      input_extensions: [".c"]
      output_extension: ".o"
      flags:
        common: ["-Wall"]
        debug: ["-g", "-O0"]
        release: ["-O3", "-DNDEBUG"]
      supports:
        defines: true
        define_flag: "-D"
        includes: true
        include_flag: "-I"
        pic: false
        dependencies: "-MMD -MP -MF {dep_file}"
    
    # C++ compilation
    cpp_compile:
      action: compile
      command: "em++ {dep_flags} -std={std} {flags} {defines} {includes} -c {input} -o {output}"
      input_extensions: [".cpp", ".cc", ".cxx", ".C"]
      output_extension: ".o"
      flags:
        common: ["-Wall"]
        debug: ["-g", "-O0"]
        release: ["-O3", "-DNDEBUG"]
      supports:
        defines: true
        define_flag: "-D"
        includes: true
        include_flag: "-I"
        pic: false
        dependencies: "-MMD -MP -MF {dep_file}"
        std: true
    
    # Static library archiving (WebAssembly doesn't use shared libraries)
    link_static_library:
      action: link
      command: "emar rcs {output} {objects}"
      input_extensions: [".o"]
      output_extension: ".a"
      output_pattern: "lib{name}.a"
      flags:
        common: []
        debug: []
        release: []
      supports:
        output_type: "static_library"
        lib_dirs: false
        libs: false
    
    # WebAssembly executable linking
    link_executable:
      action: link
      command: "em++ {flags} {objects} {lib_dirs} {libs} -o {output}"
      input_extensions: [".o"]
      output_extension: ".html"
      output_pattern: "{name}.html"
      flags:
        common: []
        debug: ["-g"]
        release: ["-O3"]
      supports:
        output_type: "executable"
        lib_dirs: true
        lib_dir_flag: "-L"
        libs: true
        lib_flag: "-l"
