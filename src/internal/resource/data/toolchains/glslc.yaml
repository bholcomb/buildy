toolchain:
  name: "glslc"
  description: "Google shaderc glslc compiler for GLSL to SPIR-V"
  language: "glsl"
  
  target:
    platform: any
    architecture: any
  
  host:
    platform: any
    architecture: any
  
  execution:
    type: native
  
  flag_mappings:
    optimization:
      none: ["-O0"]
      size: ["-Os"]
      speed: ["-O"]
      full: ["-O"]
    symbols:
      "true": ["-g"]
      "false": []

  output_prefix: ""

  tools:
    # GLSL shader compilation
    compile:
      action: compile
      command: "glslc ${flags} ${defines} ${includes} ${input} -o ${output}"
      input_extensions: [".vert", ".frag", ".comp", ".geom", ".tesc", ".tese", ".glsl"]
      output_extension: ".spv"
      flags:
        common: []
        debug: []
        release: []
      supports:
        defines: true
        define_flag: "-D"
        includes: true
        include_flag: "-I"
        dependencies: false
