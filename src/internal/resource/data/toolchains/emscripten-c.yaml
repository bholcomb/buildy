toolchain:
  name: "emscripten-c"
  description: "Emscripten C for WebAssembly compilation"
  language: c
  
  target:
    platform: wasm
    architecture: wasm32
  
  host:
    platform: any
    architecture: any
  
  execution:
    type: native
  
  flag_mappings:
    optimization:
      none: ["-O0"]
      size: ["-Os"]
      speed: ["-O2"]
      full: ["-O3"]
    warnings:
      off: []
      default: ["-Wall"]
      extra: ["-Wall", "-Wextra"]
      everything: ["-Wall", "-Wextra", "-Wpedantic"]
    symbols:
      "true": ["-g"]
      "false": []

  output_prefix: "lib"

  tools:
    # C compilation
    c_compile:
      action: compile
      command: "emcc ${dep_flags} -std=${std} ${flags} ${defines} ${includes} -c ${input} -o ${output}"
      input_extensions: [".c"]
      output_extension: ".o"
      flags:
        common: []
        debug: []
        release: []
      supports:
        defines: true
        define_flag: "-D"
        includes: true
        include_flag: "-I"
        pic: false
        dependencies: "-MMD -MP -MF ${dep_file}"
        std: true
    
    # Static library archiving (WebAssembly doesn't use shared libraries)
    link_static_library:
      action: link
      command: "emar rcs ${output} ${objects}"
      input_extensions: [".o"]
      output_extension: ".a"
      output_pattern: "${output_prefix}${name}.a"
      flags:
        common: []
        debug: []
        release: []
      supports:
        output_type: "static_library"
        lib_dirs: false
        libs: false
    
    # WebAssembly executable linking
    link_executable:
      action: link
      command: "emcc ${flags} ${objects} ${lib_dirs} ${libs} -o ${output}"
      input_extensions: [".o"]
      output_extension: ".html"
      output_pattern: "${name}.html"
      flags:
        common: []
        debug: ["-g"]
        release: ["-O3"]
      supports:
        output_type: "executable"
        lib_dirs: true
        lib_dir_flag: "-L"
        libs: true
        lib_flag: "-l"
