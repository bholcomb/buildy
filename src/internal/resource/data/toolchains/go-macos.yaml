# Go Toolchain for macOS x86_64

toolchain:
  name: "go-macos"
  description: "Go compiler for macOS"
  language: "go"
  
  target:
    platform: macos
    architecture: x86_64
  
  host:
    platform: macos
    architecture: x86_64
  
  execution:
    type: native
  
  tools:
    go_build:
      action: build
      command: "go build ${buildmode} -o ${output} ${build_tags} ${ldflags} ${gcflags} ${input}"
      input_extensions: [".go"]
      output_extension: ""
      output_pattern: "${name}"
      flags:
        common: []
        debug: ["-gcflags=all=-N -l"]
        release: ["-ldflags=-s -w", "-trimpath"]
      
      command_params:
        buildmode:
          sources: ["tool_params.buildmode", "item.buildmode"]
          format: "-buildmode=${value}"
          optional: true
        build_tags:
          sources: ["tool_params.build_tags", "item.build_tags"]
          format: "-tags ${value}"
          join: ","
          optional: true
        ldflags:
          sources: ["tool_params.ldflags", "item.ldflags"]
          format: "-ldflags \"${value}\""
          join: " "
          resolve_variables: true
          optional: true
        gcflags:
          sources: ["tool_params.gcflags", "tool.flags.${config}"]
          format: "${value}"
          quote_if_spaces: true
          optional: true
      
      manifest_files:
        - "go.mod"
        - "go.sum"
      
      supports:
        build_tags: true
        build_tags_flag: "-tags"
        ldflags: true
        ldflags_flag: "-ldflags"
        gcflags: true
        gcflags_flag: "-gcflags"
        trimpath: true
        trimpath_flag: "-trimpath"
        buildmode: true
        buildmode_flag: "-buildmode"
