toolchain:
  name: "imagemagick"
  description: "ImageMagick convert for cross-platform image conversion"
  
  target:
    platform: any
    architecture: any
  
  host:
    platform: any
    architecture: any
  
  execution:
    type: native

  output_prefix: ""

  tools:
    # Image conversion
    convert:
      action: convert
      command: "convert ${input} ${flags} ${output}"
      input_extensions: [".png", ".jpg", ".jpeg", ".bmp", ".tiff", ".tif", ".gif", ".webp"]
      output_extension: ".png"
      flags:
        # A configuration's flags follow the common ones
        common: []
        debug: ["-quality", "100"]
        release: ["-quality", "95", "-strip"]
      supports:
        defines: false
        includes: false
