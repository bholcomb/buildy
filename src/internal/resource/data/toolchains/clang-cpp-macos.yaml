toolchain:
  name: "clang-cpp-macos"
  description: "Apple Clang C++ for macOS"
  language: cpp
  
  target:
    platform: macos
    architecture: x86_64
  
  host:
    platform: macos
    architecture: x86_64
  
  execution:
    type: native
  
  tools:
    # C compilation
    c_compile:
      action: compile
      command: "clang {dep_flags} {flags} {defines} {pic} {includes} -c {input} -o {output}"
      input_extensions: [".c"]
      output_extension: ".o"
      flags:
        common: ["-Wall", "-Wextra"]
        debug: ["-g", "-O0"]
        release: ["-O3", "-DNDEBUG"]
      supports:
        defines: true
        define_flag: "-D"
        includes: true
        include_flag: "-I"
        pic: true
        pic_flag: "-fPIC"
        dependencies: "-MMD -MP -MF {dep_file}"
    
    # C++ compilation
    cpp_compile:
      action: compile
      command: "clang++ {dep_flags} -std={std} {flags} {defines} {pic} {includes} -c {input} -o {output}"
      input_extensions: [".cpp", ".cc", ".cxx", ".C", ".mm"]
      output_extension: ".o"
      flags:
        common: ["-Wall", "-Wextra"]
        debug: ["-g", "-O0"]
        release: ["-O3", "-DNDEBUG"]
      supports:
        defines: true
        define_flag: "-D"
        includes: true
        include_flag: "-I"
        pic: true
        pic_flag: "-fPIC"
        dependencies: "-MMD -MP -MF {dep_file}"
        std: true
    
    # Shared library linking (dylib on macOS)
    link_shared_library:
      action: link
      command: "clang++ -dynamiclib {flags} {objects} {lib_dirs} {libs} -o {output}"
      input_extensions: [".o"]
      output_extension: ".dylib"
      output_pattern: "lib{name}.dylib"
      flags:
        common: []
        debug: []
        release: ["-Wl,-S"]
      supports:
        output_type: "shared_library"
        lib_dirs: true
        lib_dir_flag: "-L"
        libs: true
        lib_flag: "-l"
    
    # Static library archiving
    link_static_library:
      action: link
      command: "ar rcs {output} {objects}"
      input_extensions: [".o"]
      output_extension: ".a"
      output_pattern: "lib{name}.a"
      flags:
        common: []
        debug: []
        release: []
      supports:
        output_type: "static_library"
        lib_dirs: false
        libs: false
    
    # Executable linking
    link_executable:
      action: link
      command: "clang++ {flags} {objects} {lib_dirs} {libs} -o {output}"
      input_extensions: [".o"]
      output_extension: ""
      output_pattern: "{name}"
      flags:
        common: []
        debug: []
        release: ["-Wl,-S"]
      supports:
        output_type: "executable"
        lib_dirs: true
        lib_dir_flag: "-L"
        libs: true
        lib_flag: "-l"
