# Apple Clang for macOS ARM64 (Apple Silicon). The same as clang-c-macos
# (x86_64): clang compiles for the host architecture.

toolchain:
  name: "clang-c-macos-arm64"
  description: "Apple Clang C for macOS ARM64 (Apple Silicon)"
  language: c
  
  target:
    platform: macos
    architecture: arm64

  # Of the toolchains for a platform and architecture, the one with the highest priority is the
  # default (buildy picks it when a config names none).
  priority: 10
  
  host:
    platform: macos
    architecture: arm64
  
  execution:
    type: native

  # Environment variables the tools read: their values are part of every task's cache key, so
  # changing one rebuilds what it affects.
  reads_env: [CPATH, C_INCLUDE_PATH, CPLUS_INCLUDE_PATH, OBJC_INCLUDE_PATH, LIBRARY_PATH, SDKROOT, MACOSX_DEPLOYMENT_TARGET, DEVELOPER_DIR, ZERO_AR_DATE, SOURCE_DATE_EPOCH]
  
  flag_mappings:
    optimization:
      none: ["-O0"]
      size: ["-Os"]
      speed: ["-O2"]
      full: ["-O3"]
    warnings:
      off: []
      default: ["-Wall"]
      extra: ["-Wall", "-Wextra"]
      everything: ["-Wall", "-Wextra", "-Wpedantic"]
    symbols:
      "true": ["-g"]
      "false": []
    runtime:
      debug: []
      release: []

  output_prefix: "lib"

  tools:
    # C compilation
    c_compile:
      action: compile
      command: "clang ${dep_flags} -std=${std} ${flags} ${defines} ${pic} ${includes} -c ${input} -o ${output}"
      response_file: gnu
      input_extensions: [".c"]
      output_extension: ".o"
      flags:
        common: []
        debug: []
        release: []
      supports:
        defines: true
        define_flag: "-D"
        includes: true
        include_flag: "-I"
        pic: true
        pic_flag: "-fPIC"
        dependencies: "-MMD -MP -MF ${dep_file}"
        std: true
    
    # Shared library linking (dylib on macOS)
    link_shared_library:
      action: link
      command: "clang -dynamiclib ${flags} ${objects} ${lib_dirs} ${libs} ${frameworks} -o ${output}"
      response_file: gnu
      input_extensions: [".o"]
      output_extension: ".dylib"
      output_pattern: "${output_prefix}${name}.dylib"
      flags:
        common: ["-Wl,-rpath,@loader_path"]
        debug: []
        release: []
      supports:
        output_type: "shared_library"
        lib_dirs: true
        lib_dir_flag: "-L"
        libs: true
        lib_flag: "-l"
        frameworks: true
        framework_flag: "-framework "  # the trailing space: -framework and the name are two arguments
    
    # Static library archiving
    link_static_library:
      action: link
      command: "ar rcs ${output} ${objects}"
      input_extensions: [".o"]
      output_extension: ".a"
      output_pattern: "${output_prefix}${name}.a"
      flags:
        common: []
        debug: []
        release: []
      supports:
        output_type: "static_library"
        lib_dirs: false
        libs: false
    
    # Executable linking
    link_executable:
      action: link
      command: "clang ${flags} ${objects} ${lib_dirs} ${libs} ${frameworks} -o ${output}"
      response_file: gnu
      input_extensions: [".o"]
      output_extension: ""
      output_pattern: "${name}"
      flags:
        common: ["-Wl,-rpath,@executable_path"]
        debug: []
        release: []
      supports:
        output_type: "executable"
        lib_dirs: true
        lib_dir_flag: "-L"
        libs: true
        lib_flag: "-l"
        frameworks: true
        framework_flag: "-framework "  # the trailing space: -framework and the name are two arguments
