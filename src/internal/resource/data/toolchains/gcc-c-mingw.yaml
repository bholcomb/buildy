toolchain:
  name: "gcc-c-mingw"
  description: "MinGW-w64 GCC C for Windows cross-compilation"
  language: c
  
  target:
    platform: windows
    architecture: x86_64
  
  host:
    platform: linux
    architecture: x86_64
  
  execution:
    type: native
  
  tools:
    # C compilation
    c_compile:
      action: compile
      command: "x86_64-w64-mingw32-gcc ${dep_flags} -std=${std} ${flags} ${defines} ${includes} -c ${input} -o ${output}"
      input_extensions: [".c"]
      output_extension: ".o"
      flags:
        common: ["-Wall", "-Wextra"]
        debug: ["-g", "-O0"]
        release: ["-O3", "-DNDEBUG"]
      supports:
        defines: true
        define_flag: "-D"
        includes: true
        include_flag: "-I"
        pic: false
        dependencies: "-MMD -MP -MF ${dep_file}"
        std: true
    
    # Shared library linking (DLL on Windows)
    link_shared_library:
      action: link
      command: "x86_64-w64-mingw32-gcc -shared ${flags} ${objects} ${lib_dirs} ${libs} -o ${output}"
      input_extensions: [".o"]
      output_extension: ".dll"
      output_pattern: "${name}.dll"
      flags:
        common: []
        debug: []
        release: ["-s"]
      supports:
        output_type: "shared_library"
        lib_dirs: true
        lib_dir_flag: "-L"
        libs: true
        lib_flag: "-l"
    
    # Static library archiving
    link_static_library:
      action: link
      command: "x86_64-w64-mingw32-ar rcs ${output} ${objects}"
      input_extensions: [".o"]
      output_extension: ".a"
      output_pattern: "lib${name}.a"
      flags:
        common: []
        debug: []
        release: []
      supports:
        output_type: "static_library"
        lib_dirs: false
        libs: false
    
    # Executable linking
    link_executable:
      action: link
      command: "x86_64-w64-mingw32-gcc ${flags} ${objects} ${lib_dirs} ${libs} -o ${output}"
      input_extensions: [".o"]
      output_extension: ".exe"
      output_pattern: "${name}.exe"
      flags:
        common: []
        debug: []
        release: ["-s"]
      supports:
        output_type: "executable"
        lib_dirs: true
        lib_dir_flag: "-L"
        libs: true
        lib_flag: "-l"
