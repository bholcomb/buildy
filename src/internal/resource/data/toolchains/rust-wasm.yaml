# Rust Toolchain for WebAssembly

toolchain:
  name: "rust-wasm"
  description: "Rust compiler for WebAssembly"
  language: "rust"
  
  target:
    platform: wasm
    architecture: wasm32
  
  host:
    platform: any
    architecture: any
  
  execution:
    type: native

  output_prefix: ""

  # Where Cargo puts this toolchain's artifacts, under the --target-dir: the Rust templates'
  # outputs are ${output_dir}/cargo/${cargo_triple_dir}${profile}/<file>.
  variables:
    cargo_triple_dir: "wasm32-unknown-unknown/"
    exe_ext: ".wasm"
    staticlib_name: "lib${item.name}.a"
    cdylib_name: "${item.name}.wasm"

  tools:
    cargo_build:
      action: build
      command: "cargo build ${release_flag} ${lib_flag} --target wasm32-unknown-unknown --target-dir ${output_dir}/cargo ${features}"
      input_extensions: [".rs"]
      output_extension: ".wasm"
      output_pattern: "${name}.wasm"
      flags:
        common: []
        debug: []
        release: ["--release"]
      
      command_params:
        # Cargo's profile directory: release when the configuration's flags pass --release
        profile:
          sources: ["tool.flags.${config}"]
          match: "--release"
          format: "release"
          default: "debug"
        # The executable's name: bin: if set, else the target's name
        bin_name:
          sources: ["tool_params.bin", "item.bin", "item.name"]
          format: "${value}"
        release_flag:
          sources: ["tool.flags.${config}"]
          match: "--release"
          format: "${value}"
          optional: true
        lib_flag:
          sources: ["tool_params.crate_type"]
          format: "--lib"
          optional: true
        features:
          sources: ["tool_params.features", "item.features"]
          format: "--features ${value}"
          join: ","
          optional: true
      
      
      supports:
        features: true
        features_flag: "--features"
