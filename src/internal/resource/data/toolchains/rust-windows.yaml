# Rust Toolchain for Windows (cross-compile from Linux)

toolchain:
  name: "rust-windows"
  description: "Rust compiler for Windows (cross-compile from Linux)"
  language: "rust"
  
  target:
    platform: windows
    architecture: x86_64
  
  host:
    platform: linux
    architecture: x86_64
  
  execution:
    type: native
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: "x86_64-w64-mingw32-gcc"

  output_prefix: ""

  # Where Cargo puts this toolchain's artifacts, under the --target-dir: the Rust templates'
  # outputs are ${output_dir}/cargo/${cargo_triple_dir}${profile}/<file>.
  variables:
    cargo_triple_dir: "x86_64-pc-windows-gnu/"
    exe_ext: ".exe"
    staticlib_name: "lib${item.name}.a"
    cdylib_name: "${item.name}.dll"

  tools:
    cargo_build:
      action: build
      command: "cargo build ${flags} ${lib_flag} --target x86_64-pc-windows-gnu --target-dir ${output_dir}/cargo ${features} ${bin_flag}"
      input_extensions: [".rs"]
      output_extension: ".exe"
      output_pattern: "${name}.exe"
      flags:
        common: []
        debug: []
        release: ["--release"]

      command_params:
        # Cargo's profile directory: release when the configuration's flags pass --release
        profile:
          sources: ["tool.flags.${config}"]
          match: "--release"
          format: "release"
          default: "debug"
        # The executable's name: bin: if set, else the target's name
        bin_name:
          sources: ["tool_params.bin", "item.bin", "item.name"]
          format: "${value}"
        lib_flag:
          sources: ["tool_params.crate_type"]
          format: "--lib"
        features:
          sources: ["tool_params.features", "item.features"]
          format: "--features ${value}"
          join: ","
        bin_flag:
          sources: ["tool_params.bin", "item.bin"]
          format: "--bin ${value}"
