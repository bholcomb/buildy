# Rust Toolchain for macOS x86_64

toolchain:
  name: "rust-macos"
  description: "Rust compiler for macOS"
  language: "rust"
  
  target:
    platform: macos
    architecture: x86_64
  
  host:
    platform: macos
    architecture: x86_64
  
  execution:
    type: native
  
  tools:
    cargo_build:
      action: build
      command: "cargo build ${release_flag} ${lib_flag} --target-dir ${output_dir} ${features} ${bin_flag}"
      input_extensions: [".rs"]
      output_extension: ""
      output_pattern: "${name}"
      flags:
        common: []
        debug: []
        release: ["--release"]
      
      command_params:
        release_flag:
          sources: ["tool.flags.${config}"]
          match: "--release"
          format: "${value}"
          optional: true
        lib_flag:
          sources: ["tool_params.crate_type"]
          format: "--lib"
          optional: true
        features:
          sources: ["tool_params.features", "item.features"]
          format: "--features ${value}"
          join: ","
          optional: true
        bin_flag:
          sources: ["tool_params.bin", "item.bin"]
          format: "--bin ${value}"
          optional: true
      
      manifest_files:
        - "Cargo.toml"
        - "Cargo.lock"
      
      supports:
        features: true
        features_flag: "--features"
        all_features: true
        all_features_flag: "--all-features"
        no_default_features: true
        no_default_features_flag: "--no-default-features"
