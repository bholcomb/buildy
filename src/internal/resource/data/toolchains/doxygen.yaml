toolchain:
  name: "doxygen"
  description: "Doxygen documentation generator"
  language: docs
  
  target:
    platform: any
    architecture: any
  
  host:
    platform: any
    architecture: any
  
  execution:
    type: native

  output_prefix: ""

  tools:
    # Generate documentation from a Doxyfile
    generate_docs:
      action: generate
      command: "doxygen ${input}"
      input_extensions: [".doxyfile", ".doxy", "Doxyfile"]
      output_extension: ""
      output_pattern: "${name}"
      flags:
        common: []
        debug: []
        release: []
      supports:
        defines: false
        includes: false

    # Generate documentation with custom output directory
