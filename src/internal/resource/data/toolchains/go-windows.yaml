# Go Toolchain for Windows (cross-compile)

toolchain:
  name: "go-windows"
  description: "Go compiler for Windows"
  language: "go"
  
  target:
    platform: windows
    architecture: x86_64
  
  host:
    platform: any
    architecture: any
  
  execution:
    type: native
    env:
      GOOS: windows
      GOARCH: amd64
  
  tools:
    go_build:
      action: build
      command: "go build ${buildmode} ${flags} -o ${output} ${build_tags} ${ldflags} ${gcflags} ${input}"
      input_extensions: [".go"]
      output_extension: ".exe"
      output_pattern: "${name}.exe"
      flags:
        common: []
        debug: []
        release: ["-trimpath"]
      
      command_params:
        buildmode:
          sources: ["tool_params.buildmode", "item.buildmode"]
          format: "-buildmode=${value}"
          optional: true
        build_tags:
          sources: ["tool_params.build_tags", "item.build_tags"]
          format: "-tags ${value}"
          join: ","
          optional: true
        ldflags:
          sources: ["tool_params.ldflags", "item.ldflags"]
          format: "-ldflags \"${value}\""
          join: " "
          resolve_variables: true
          optional: true
        gcflags:
          sources: ["tool_params.gcflags", "item.gcflags"]
          format: "-gcflags=${value}"
          optional: true
      
      manifest_files:
        - "go.mod"
        - "go.sum"
      
      supports:
        build_tags: true
        build_tags_flag: "-tags"
        ldflags: true
        ldflags_flag: "-ldflags"
        gcflags: true
        gcflags_flag: "-gcflags"
        trimpath: true
        trimpath_flag: "-trimpath"
        buildmode: true
        buildmode_flag: "-buildmode"
