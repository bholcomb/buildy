# Go Toolchain for Windows (cross-compile)

toolchain:
  name: "go-windows"
  description: "Go compiler for Windows"
  language: "go"
  
  target:
    platform: windows
    architecture: x86_64
  
  host:
    platform: any
    architecture: any
  
  execution:
    type: native
    env:
      GOOS: windows
      GOARCH: amd64

  output_prefix: ""

  # The C-compatible libraries' file names (the Go library templates' outputs)
  variables:
    c_shared_name: "${item.name}.dll"
    c_archive_name: "lib${item.name}.a"

  tools:
    go_build:
      action: build
      command: "go build ${buildmode} ${flags} -o ${output} ${build_tags} ${ldflags} ${gcflags} ${input}"
      input_extensions: [".go"]
      output_extension: ".exe"
      output_pattern: "${name}.exe"
      flags:
        common: []
        debug: []
        release: ["-trimpath"]

      # The target's options (build_tags, ldflags, gcflags, buildmode), each as go build takes it
      command_params:
        buildmode:
          sources: ["tool_params.buildmode", "item.buildmode"]
          format: "-buildmode=${value}"
        build_tags:
          sources: ["tool_params.build_tags", "item.build_tags"]
          format: "-tags ${value}"
          join: ","
        ldflags:
          sources: ["tool_params.ldflags", "item.ldflags"]
          format: "-ldflags=${value}"
        gcflags:
          sources: ["tool_params.gcflags", "item.gcflags"]
          format: "-gcflags=${value}"
