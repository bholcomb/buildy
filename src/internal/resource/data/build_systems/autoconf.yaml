build_system:
  name: autoconf
  description: "GNU Autoconf/Automake build system"

  detection:
    marker_files: ["configure", "configure.ac", "configure.in"]
    priority: 8

  # Autoconf has no configurations: pass ${config}-dependent settings in build.args
  # (CFLAGS=... for configure).
  reads_env: [CC, CXX, CPP, CFLAGS, CXXFLAGS, CPPFLAGS, LDFLAGS, LIBS, PKG_CONFIG_PATH]

  # A build directory per configuration (a VPATH build): configure runs from it.
  phases:
    configure:
      command: "${source_dir}/configure --prefix=${install_dir} --libdir=${install_dir}/lib ${args}"
      working_dir: "${build_dir}"

    build:
      command: "make -j${jobs}"
      working_dir: "${build_dir}"

    install:
      command: "make install"
      working_dir: "${build_dir}"

  output:
    include_patterns:
      - "${install_dir}/include"
      - "${source_dir}/include"
    lib_patterns:
      - "${install_dir}/lib"
