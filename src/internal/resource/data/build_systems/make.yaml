build_system:
  name: make
  description: "GNU Make build system"

  detection:
    marker_files: ["Makefile", "GNUmakefile", "makefile"]
    priority: 5

  # A Makefile builds in its source tree, one configuration at a time: buildy runs make clean
  # before each build. Make has no configurations: pass ${config}-dependent settings in
  # build.args (CFLAGS=...). There is no install phase: a Makefile's install target and its
  # prefix variable aren't standard.
  in_source: true

  reads_env: [CC, CXX, CFLAGS, CXXFLAGS, CPPFLAGS, LDFLAGS, MAKEFLAGS]

  phases:
    clean:
      command: "make clean"
      working_dir: "${source_dir}"

    build:
      command: "make -j${jobs} ${args}"
      working_dir: "${source_dir}"

  output:
    include_patterns:
      - "${source_dir}/include"
      - "${source_dir}"
    lib_patterns:
      - "${source_dir}"
      - "${source_dir}/lib"
