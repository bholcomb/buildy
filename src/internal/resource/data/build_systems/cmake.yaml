build_system:
  name: cmake
  description: "CMake build system"

  detection:
    marker_files: ["CMakeLists.txt"]
    priority: 10

  # CMAKE_BUILD_TYPE for a single-configuration generator (Makefiles, Ninja), --config for a
  # multi-configuration one (Visual Studio, the default on Windows, and Xcode); each generator
  # ignores the other.
  configurations:
    debug: Debug
    release: Release

  reads_env: [CC, CXX, CFLAGS, CXXFLAGS, LDFLAGS, CMAKE_GENERATOR, CMAKE_PREFIX_PATH, SDKROOT, MACOSX_DEPLOYMENT_TARGET]

  phases:
    configure:
      command: "cmake -S ${source_dir} -B ${build_dir} -DCMAKE_BUILD_TYPE=${build_type} -DCMAKE_INSTALL_PREFIX=${install_dir} -DCMAKE_INSTALL_LIBDIR=lib ${args}"

    build:
      command: "cmake --build ${build_dir} --config ${build_type} --parallel ${jobs}"

    install:
      command: "cmake --install ${build_dir} --config ${build_type} --prefix ${install_dir}"

  output:
    include_patterns:
      - "${install_dir}/include"
      - "${source_dir}/include"
      - "${build_dir}/include"
    lib_patterns:
      - "${install_dir}/lib"
      - "${build_dir}/${build_type}"
      - "${build_dir}/lib"
      - "${build_dir}"
