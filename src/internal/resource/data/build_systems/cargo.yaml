build_system:
  name: cargo
  description: "Rust Cargo build system"

  detection:
    marker_files: ["Cargo.toml"]
    priority: 10

  # Cargo profiles; the dev profile's output directory is named debug.
  configurations:
    debug: dev
    release: release

  reads_env: [RUSTFLAGS, CARGO_BUILD_TARGET, CC, CFLAGS]

  phases:
    build:
      command: "cargo build --profile ${build_type} --target-dir ${build_dir} ${args}"
      working_dir: "${source_dir}"

  output:
    include_patterns:
      - "${source_dir}/include"
    lib_patterns:
      - "${build_dir}/debug"
      - "${build_dir}/release"
