build_system:
  name: meson
  description: "Meson build system"

  detection:
    marker_files: ["meson.build"]
    priority: 10

  configurations:
    debug: debug
    release: release

  reads_env: [CC, CXX, CFLAGS, CXXFLAGS, LDFLAGS, PKG_CONFIG_PATH, SDKROOT, MACOSX_DEPLOYMENT_TARGET]

  phases:
    configure:
      command: "meson setup ${build_dir} ${source_dir} --buildtype=${build_type} --prefix=${install_dir} --libdir=lib ${args}"

    build:
      command: "meson compile -C ${build_dir} -j ${jobs}"

    install:
      command: "meson install -C ${build_dir}"

  output:
    include_patterns:
      - "${install_dir}/include"
      - "${source_dir}/include"
    lib_patterns:
      - "${install_dir}/lib"
      - "${build_dir}"
