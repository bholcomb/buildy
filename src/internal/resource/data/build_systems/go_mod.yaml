build_system:
  name: go_mod
  description: "Go modules build system"

  detection:
    marker_files: ["go.mod"]
    priority: 10

  # Go has no configurations: pass ${config}-dependent settings in build.args.
  reads_env: [GOFLAGS, CGO_ENABLED, GOOS, GOARCH, CC, CGO_CFLAGS, CGO_LDFLAGS]

  phases:
    build:
      command: "go build -o ${build_dir}/ ${args} ./..."
      working_dir: "${source_dir}"

  output:
    include_patterns: []
    lib_patterns:
      - "${build_dir}"
