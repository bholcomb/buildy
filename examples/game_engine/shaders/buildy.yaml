project:
  name: engine_shaders
  description: "GLSL shaders compiled to SPIR-V"

variables:
  MODULE_NAME: "engine_shaders"

targets:
  artifacts:
    shaders:
      - name: basic_vert
        tool: glslc
        sources: ["src/basic.vert"]
        output: "${output_dir}/shaders/basic.vert.spv"
        
      - name: basic_frag
        tool: glslc
        sources: ["src/basic.frag"]
        output: "${output_dir}/shaders/basic.frag.spv"
        
      - name: unlit_vert
        tool: glslc
        sources: ["src/unlit.vert"]
        output: "${output_dir}/shaders/unlit.vert.spv"
        
      - name: unlit_frag
        tool: glslc
        sources: ["src/unlit.frag"]
        output: "${output_dir}/shaders/unlit.frag.spv"
        
      - name: skybox_vert
        tool: glslc
        sources: ["src/skybox.vert"]
        output: "${output_dir}/shaders/skybox.vert.spv"
        
      - name: skybox_frag
        tool: glslc
        sources: ["src/skybox.frag"]
        output: "${output_dir}/shaders/skybox.frag.spv"
        
      - name: shadow_vert
        tool: glslc
        sources: ["src/shadow.vert"]
        output: "${output_dir}/shaders/shadow.vert.spv"
        
      - name: shadow_frag
        tool: glslc
        sources: ["src/shadow.frag"]
        output: "${output_dir}/shaders/shadow.frag.spv"
        
      - name: postprocess_vert
        tool: glslc
        sources: ["src/postprocess.vert"]
        output: "${output_dir}/shaders/postprocess.vert.spv"
        
      - name: postprocess_frag
        tool: glslc
        sources: ["src/postprocess.frag"]
        output: "${output_dir}/shaders/postprocess.frag.spv"
