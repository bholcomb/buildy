project:
  name: engine_renderer
  description: "Rendering engine - graphics, shaders, materials"

variables:
  MODULE_NAME: "engine_renderer"

targets:
  shared_libraries:
    - name: engine_renderer
      language: cpp
      sources:
        - "src/*.cpp"
      include_dirs:
        - "include"
        - "../core/include"
        - "../platform/include"
      libs:
        - engine_core
        - engine_platform
      defines:
        - "ENGINE_RENDERER_EXPORTS"
        # Debug rendering features
        - debug:
            - "ENGINE_RENDERER_DEBUG_DRAW=1"
