project:
  name: game
  description: "Game executable"

variables:
  GAME_NAME: "MyGame"

targets:
  executables:
    - name: mygame
      language: cpp
      sources:
        - "src/*.cpp"
      include_dirs:
        private:
          - "../core/include"
          - "../platform/include"
          - "../renderer/include"
          - "../audio/include"
      
      # packages: External packages (provide include_dirs, lib_dirs, libs, defines)
      packages:
        - glfw3
      
      # libs: Internal libraries to link against
      libs:
        - engine_renderer
        - engine_audio
        - engine_platform
        - engine_core
      
      # depends_on: Build ordering
      depends_on:
        targets:
          - engine_core
          - engine_platform
          - engine_renderer
          - engine_audio
