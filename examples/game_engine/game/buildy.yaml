project:
  name: game
  description: "Game executable"

variables:
  GAME_NAME: "MyGame"

executable:
  name: mygame
  sources:
    - "src/main.cpp"
    - "src/game.cpp"
  include_dirs:
    - "../core/include"
    - "../renderer/include"
    - "../audio/include"
  packages:
    - glfw3
  depends_on:
    - engine_core
    - engine_renderer
    - engine_audio

