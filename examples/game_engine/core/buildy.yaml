project:
  name: engine_core
  description: "Core engine library - types, math, memory, logging"

variables:
  MODULE_NAME: "engine_core"

targets:
  shared_libraries:
    - name: engine_core
      language: cpp
      sources:
        - "src/*.cpp"
      public_headers:
        - "include/*.h"
        - "include/core/*.h"
      include_dirs:
        public: ["include"]
      compile:
        defines: ["ENGINE_CORE_EXPORTS"]
