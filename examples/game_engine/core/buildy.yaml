project:
  name: engine_core
  description: "Core engine library"

variables:
  MODULE_NAME: "engine_core"

targets:
  libraries:
    - name: engine_core
      type: static_library
      language: c++
      sources:
        - "src/engine.cpp"
        - "src/math.cpp"
        - "src/memory.cpp"
      public_headers: ["include/*.h"]
      include_dirs:
        public: ["include"]
