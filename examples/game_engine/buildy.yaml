project:
  name: game_engine
  version: "1.0.0"
  description: "Cross-platform game engine example"

variables:
  import_env_vars:
    - name: THIRD_PARTY_ROOT
      default: "./third_party"
  
  ENGINE_VERSION: "1.0.0"
  BUILD_DIR: "build"

workspace:
  modules:
    - src/core
    - src/platform
    - src/renderer
    - src/audio
    - assets/shaders
    - src/game

dependencies:
  file: buildy_config/dependencies.yaml

environment:
  toolchains:
    default: gcc-cpp-linux
    windows: msvc-cpp-windows
    macos: clang-cpp-macos
    
  compile:
    cpp_standard: "c++17"
    warnings: extra
    
  configurations:
    debug:
      optimization: none
      symbols: true
    release:
      optimization: full

# Assemble the final product structure
staging:
  name: game_engine
  destination: "${out_dir}/staging"
  use_symlinks: true

  contents:
    # Root level files
    - folder: "."
      files: ["LICENSE.txt", "README.md"]

    # Binaries - executables and shared libraries together
    - folder: bin
      targets:
        - mygame
        - engine_core
        - engine_platform
        - engine_renderer
        - engine_audio

    # Data folder with subfolders
    - folder: data
      contents:
        - folder: shaders
          artifacts:
            - vertex_shaders
            - fragment_shaders

        - folder: textures
          files: ["assets/textures/*.png"]

        - folder: meshes
          files: ["assets/meshes/*.mesh"]

# Package for distribution
install:
  - name: game_engine_release
    staging: game_engine
    destination: "${out_dir}/dist"
    format: zip
    filename: "${project_name}-${project_version}-${platform}-${arch}"
