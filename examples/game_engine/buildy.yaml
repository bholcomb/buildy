project:
  name: game_engine
  version: "1.0.0"
  description: "Cross-platform game engine example"

variables:
  import_env_vars:
    - name: THIRD_PARTY_ROOT
      default: "./third_party"
  
  ENGINE_VERSION: "1.0.0"
  BUILD_DIR: "build"

workspace:
  modules:
    common:
      - core
      - renderer
      - audio
      - game

dependencies:
  file: buildy/dependencies.yaml

environment:
  toolchains:
    default: gcc-linux
    windows: msvc-windows
    macos: clang-macos
    
  compile:
    cpp_standard: "c++17"
    warnings: ["-Wall", "-Wextra"]
    
  configurations:
    debug:
      optimization: "-O0"
      defines: ["DEBUG=1"]
      flags: ["-g"]
    release:
      optimization: "-O3"
      defines: ["NDEBUG=1"]
      flags: ["-flto"]
