project:
  name: game_engine
  version: "1.0.0"

# Workspace configuration
workspace:
  discover:
    - "**/buildy.yaml"
  exclude:
    - ".buildy_cache/**"
    - "build/**"

# Workspace-level configuration (inherited by all modules)
config:
  cpp_standard: "c++17"
  compiler_flags:
    - "-Wall"
    - "-Wextra"
    - "-g"
    - "-O0"
  defines: []

# Workspace-level variables
variables:
  ENGINE_VERSION: "1.0.0"
  BUILD_DIR: "build"
  INCLUDE_DIR: "include"

