project:
  name: engine_audio
  description: "Audio engine - sounds, music, 3D audio, effects"

variables:
  MODULE_NAME: "engine_audio"

targets:
  libraries:
    - name: engine_audio
      type: shared_library
      language: c++
      sources:
        - "src/*.cpp"
      public_headers:
        - "include/*.h"
        - "include/audio/*.h"
      include_dirs:
        public: ["include"]
        private: ["../core/include"]
      libs:
        - engine_core
      depends_on:
        targets: ["engine_core"]
      compile:
        defines: ["ENGINE_AUDIO_EXPORTS"]
