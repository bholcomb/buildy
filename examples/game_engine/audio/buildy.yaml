project:
  name: engine_audio
  description: "Audio engine"

variables:
  MODULE_NAME: "engine_audio"

targets:
  libraries:
    - name: engine_audio
      type: static_library
      language: c++
      sources:
        - "src/audio.cpp"
        - "src/sound.cpp"
        - "src/music.cpp"
      public_headers: ["include/*.h"]
      include_dirs:
        public: ["include"]
        private: ["../core/include"]
      depends_on:
        targets: ["engine_core"]
