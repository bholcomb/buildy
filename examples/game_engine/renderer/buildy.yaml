project:
  name: engine_renderer
  description: "Rendering engine - graphics, shaders, materials"

variables:
  MODULE_NAME: "engine_renderer"

targets:
  shared_libraries:
    - name: engine_renderer
      language: cpp
      sources:
        - "src/*.cpp"
      include_dirs:
        - "include"
        - "../core/include"
        - "../platform/include"
      libs:
        - engine_core
        - engine_platform
      depends_on:
        targets:
          - engine_core
          - engine_platform
      compile:
        defines: ["ENGINE_RENDERER_EXPORTS"]
