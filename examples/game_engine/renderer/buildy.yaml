project:
  name: engine_renderer
  description: "Rendering engine - graphics, shaders, materials"

variables:
  MODULE_NAME: "engine_renderer"

targets:
  libraries:
    - name: engine_renderer
      type: shared_library
      language: cpp
      sources:
        - "src/*.cpp"
      public_headers:
        - "include/*.h"
        - "include/renderer/*.h"
      include_dirs:
        public: ["include"]
        private:
          - "../core/include"
          - "../platform/include"
      libs:
        - engine_core
        - engine_platform
      depends_on:
        targets:
          - engine_core
          - engine_platform
      compile:
        defines: ["ENGINE_RENDERER_EXPORTS"]
