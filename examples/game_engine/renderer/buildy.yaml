project:
  name: renderer
  description: "Rendering engine"

variables:
  MODULE_NAME: "engine_renderer"

library:
  name: engine_renderer
  type: static_library
  sources:
    - "src/renderer.cpp"
    - "src/shader.cpp"
    - "src/texture.cpp"
  include_dirs:
    - "include"
    - "../core/include"  # Need core headers
  depends_on:
    - engine_core  # Simple dependency (unambiguous)

