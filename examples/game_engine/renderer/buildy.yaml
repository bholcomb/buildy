project:
  name: engine_renderer
  description: "Rendering engine"

variables:
  MODULE_NAME: "engine_renderer"

targets:
  libraries:
    - name: engine_renderer
      type: static_library
      language: c++
      sources:
        - "src/renderer.cpp"
        - "src/shader.cpp"
        - "src/texture.cpp"
      public_headers: ["include/*.h"]
      include_dirs:
        public: ["include"]
        private: ["../core/include"]
      depends_on:
        targets: ["engine_core"]
