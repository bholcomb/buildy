project:
  name: math-library
  version: "1.0.0"
  description: "Simple math library example demonstrating filtered lists"

environment:
  compile:
    cpp_standard: "c++20"
    warnings: ["-Wall", "-Wextra"]
    
  configurations:
    debug:
      optimization: "-O0"
    release:
      optimization: "-O3"

targets:
  static_libraries:
    - name: mathcore
      language: cpp
      sources: ["libsrc/*.cpp"]
      include_dirs: ["include"]
      defines:
        # Common defines (always included)
        - "MATH_LIB_VERSION=1"
        # Configuration-specific defines using filtered list syntax
        - debug:
            - "DEBUG=1"
            - "ENABLE_ASSERTS=1"
        - release:
            - "NDEBUG=1"

  executables:
    - name: calculator
      language: cpp
      sources: ["appsrc/main.cpp"]
      include_dirs: ["include"]
      libs:
        - mathcore
      defines:
        - debug:
            - "DEBUG=1"
        - release:
            - "NDEBUG=1"
