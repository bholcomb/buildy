project:
  name: math-library
  version: "1.0.0"
  description: "Simple math library example"

environment:
  compile:
    cpp_standard: "c++20"
    warnings: ["-Wall", "-Wextra"]
    
  configurations:
    debug:
      optimization: "-O0"
      defines: ["DEBUG=1", "MATH_LIB_VERSION=1"]
      flags: ["-g"]
    release:
      optimization: "-O3"
      defines: ["NDEBUG=1", "MATH_LIB_VERSION=1"]

targets:
  libraries:
    - name: mathcore
      type: static_library
      language: c++
      sources: ["libsrc/*.cpp"]
      public_headers: ["include/*.h"]
      include_dirs:
        public: ["include"]

  executables:
    - name: calculator
      language: c++
      sources: ["appsrc/main.cpp"]
      include_dirs:
        private: ["include"]
      depends_on:
        targets: ["mathcore"]
