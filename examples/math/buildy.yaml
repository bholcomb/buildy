project:
  name: math-library
  version: "1.0.0"
  description: "Simple math library example"

environment:
  compile:
    cpp_standard: "c++20"
    warnings: ["-Wall", "-Wextra"]
    
  configurations:
    debug:
      optimization: "-O0"
      defines: ["DEBUG=1", "MATH_LIB_VERSION=1"]
      flags: ["-g"]
    release:
      optimization: "-O3"
      defines: ["NDEBUG=1", "MATH_LIB_VERSION=1"]

targets:
  static_libraries:
    - name: mathcore
      language: cpp
      sources: ["libsrc/*.cpp"]
      include_dirs: ["include"]

  executables:
    - name: calculator
      language: cpp
      sources: ["appsrc/main.cpp"]
      include_dirs: ["include"]
      libs:
        - mathcore
      depends_on:
        targets: ["mathcore"]
