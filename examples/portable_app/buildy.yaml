project:
  name: portable_app
  version: "1.0.0"
  description: "Example demonstrating fetch dependencies and Docker builds"

variables:
  APP_NAME: "PortableApp"

dependencies:
  file: buildy_config/dependencies.yaml

environment:
  # Every compile and link runs in the toolchain's Docker image (gcc:13)
  toolchains:
    default: docker-cpp-linux

  compile:
    cpp_standard: "c++17"
    warnings: extra

  configurations:
    debug:
      optimization: none
      symbols: true
      defines: ["DEBUG=1"]
    release:
      optimization: speed
      defines: ["NDEBUG=1"]

targets:
  executables:
    - name: portable_app
      language: cpp
      sources: ["src/*.cpp"]
      include_dirs: ["src"]
      deps:
        - sdl2
        - nlohmann_json
      defines:
        - "APP_NAME=\"${APP_NAME}\""

staging:
  name: portable_app
  destination: "${out_dir}/staging"
  use_symlinks: true

  contents:
    - folder: "."
      files: ["README.md"]

    - folder: bin
      targets:
        - portable_app

install:
  - name: portable_app_release
    staging: portable_app
    destination: "${out_dir}/dist"
    format: tar.gz
    filename: "${project_name}-${project_version}-${platform}-${arch}"
