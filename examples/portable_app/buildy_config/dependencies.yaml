# External dependencies for portable_app project
# New unified format: each top-level key is a dependency name

sdl2:
  description: "Simple DirectMedia Layer"
  version: "2.28.5"
  
  common:
    git: "https://github.com/libsdl-org/SDL.git"
    ref: "release-2.28.5"
    build:
      system: cmake
      args:
        - "-DSDL_SHARED=OFF"
        - "-DSDL_STATIC=ON"
        - "-DSDL_TEST=OFF"
    include_dirs: ["${dep_dir}/_install/include"]
    lib_dirs: ["${dep_dir}/_install/lib"]
    libs: ["SDL2"]
    execution:
      type: docker
      image: "gcc:13"
      volumes:
        - "${PWD}:/workspace"
      working_dir: "/workspace"
      user: "${UID}:${GID}"

nlohmann_json:
  description: "JSON for Modern C++"
  version: "3.11.3"
  
  common:
    url: "https://github.com/nlohmann/json/releases/download/v3.11.3/json.tar.xz"
    checksum: "sha256:d6c65aca6b1ed68e7a182f4757f0f7c6c9e4c1b2d69d2f5e2e6b3e8f1a2b3c4d5"
    include_dirs: ["${dep_dir}/include"]
