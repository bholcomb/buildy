# GLFW3 - Cross-platform OpenGL/Vulkan windowing library
# https://www.glfw.org/
#
# Windows: Fetches source and builds with buildy (no CMake required)
# Linux/macOS: Uses system-installed GLFW

fetch:
  glfw:
    platforms: [windows]
    type: url
    url: https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.zip
    extract: true
    # Use a buildy config file instead of a build_system
    config: glfw_buildy.yaml
    provides:
      include_dirs:
        - _install/include
      library_dirs:
        - _install/lib
      libs:
        - glfw3

# On Linux/macOS, use system package
system:
  glfw:
    platforms: [linux, macos]
    include_dirs:
      linux: [/usr/include]
      macos: [/usr/local/include, /opt/homebrew/include]
    library_dirs:
      linux: [/usr/lib, /usr/lib/x86_64-linux-gnu]
      macos: [/usr/local/lib, /opt/homebrew/lib]
    libs:
      linux:
        - glfw
        - X11
        - pthread
        - dl
      macos:
        - glfw
