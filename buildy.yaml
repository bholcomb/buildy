project:
  name: buildy
  version: "1.0.0"
  description: "Multi-language build system"

workspace:
  modules:
    common:
      - "."

variables:
  import_env_vars:
    - name: BUILDY_CACHE_DIR
      default: ".buildy_cache"

environment:
  configurations:
    debug:
      defines: []
    release:
      defines: []

targets:
  executables:
    - name: buildy
      language: go
      path: "src"
      build_tags: []
      ldflags:
        - -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        - -X main.GitCommit=$(git rev-parse --short HEAD)
        - -X main.BuildConfig=${config}

# Note: artifacts.copy is handled by bootstrap.sh to avoid "text file busy"
# when buildy builds itself
