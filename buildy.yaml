project:
  name: buildy
  version: "1.0.0"
  description: "Multi-language build system"

workspace:
  modules:
    common:
      - "."

variables:
  import_env_vars:
    - name: BUILDY_CACHE_DIR
      default: ".buildy_cache"

environment:
  configurations:
    debug:
      defines: []
    release:
      defines: []

targets:
  executables:
    - name: buildy
      language: go
      path: "src"
      output: "bin/buildy"
      build_tags: []
      ldflags: []
