project:
  name: buildy
  description: "Multi-language build system"

workspace:
  modules:
    common:
      - "."

variables:
  import_env_vars:
    - name: BUILDY_CACHE_DIR
      default: ".buildy_cache"
    # The build's time and commit, from the environment (buildy runs go without a shell):
    #   BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) GIT_COMMIT=$(git rev-parse --short HEAD) buildy -r
    - name: BUILD_TIME
      default: unknown
    - name: GIT_COMMIT
      default: unknown

environment:
  configurations:
    debug:
      defines: []
    release:
      defines: []

targets:
  executables:
    - name: buildy
      language: go
      path: "src"
      ldflags:
        - -X main.BuildTime=${BUILD_TIME}
        - -X main.GitCommit=${GIT_COMMIT}
        - -X main.BuildConfig=${config}
        - release: [-s, -w]

# buildy builds itself into build/<platform>-<arch>-<config>/bin/ and copies it nowhere:
# replacing the running executable fails ("text file busy"). Build the first one with
#   cd src && go build -o ../bin/buildy .
