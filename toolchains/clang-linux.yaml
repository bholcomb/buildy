toolchain:
  name: "clang-linux"
  description: "Clang/LLVM compiler for Linux x86_64"
  
  target:
    platform: linux
    architecture: x86_64
  
  host:
    platform: linux
    architecture: x86_64
  
  execution:
    type: native
  
  tools:
    c_compiler: clang
    cxx_compiler: clang++
    linker: clang++
    archiver: llvm-ar
    strip: llvm-strip
    objcopy: llvm-objcopy
  
  compile:
    command: "{cxx_compiler} {dep_flags} -std={std} {flags} {defines} {pic} {includes} -c {input} -o {output}"
    
    flags:
      common: ["-Wall", "-Wextra", "-Wno-unused-parameter"]
      debug: ["-g", "-O0"]
      release: ["-O3", "-DNDEBUG", "-flto"]
    
    dep_flags: "-MMD -MP -MF {dep_file}"
    pic_flag: "-fPIC"
    include_flag: "-I"
    define_flag: "-D"
  
  link:
    shared_library:
      command: "{linker} -shared {pic} {objects} {lib_dirs} {libs} -o {output}"
      output_pattern: "lib{name}.so"
      pic_flag: "-fPIC"
    
    static_library:
      command: "{archiver} rcs {output} {objects}"
      output_pattern: "lib{name}.a"
    
    executable:
      command: "{linker} {objects} {lib_dirs} {libs} -o {output}"
      output_pattern: "{name}"
    
    lib_dir_flag: "-L"
    lib_flag: "-l"
  
  extensions:
    object: ".o"
    dependency: ".d"
    shared_library: ".so"
    static_library: ".a"
    executable: ""

