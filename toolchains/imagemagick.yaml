toolchain:
  name: "imagemagick"
  description: "ImageMagick convert for cross-platform image conversion"
  
  target:
    platform: any
    architecture: any
  
  host:
    platform: any
    architecture: any
  
  execution:
    type: native
  
  tools:
    # Image conversion
    convert:
      action: convert
      command: "convert {input} {flags} {output}"
      input_extensions: [".png", ".jpg", ".jpeg", ".bmp", ".tiff", ".tif", ".gif", ".webp"]
      output_extension: ".png"
      flags:
        common: ["-quality", "95"]
        debug: ["-quality", "100"]
        release: ["-quality", "95", "-strip"]
      supports:
        defines: false
        includes: false
