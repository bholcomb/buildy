toolchain:
  name: "imagemagick"
  description: "ImageMagick convert for cross-platform image conversion"
  
  target:
    platform: any
    architecture: any
  
  host:
    platform: any
    architecture: any
  
  execution:
    type: native
  
  tools:
    c_compiler: convert
    cxx_compiler: convert
    linker: ""
    archiver: ""
  
  # Image conversion configuration
  compile:
    # Command template for image conversion
    # Variables: {cxx_compiler}, {flags}, {input}, {output}
    command: "{cxx_compiler} {input} {flags} {output}"
    
    # Configuration-specific flags
    flags:
      common: ["-quality", "95"]
      debug: ["-quality", "100"]
      release: ["-quality", "95", "-strip"]  # Strip metadata in release
    
    # No dependency generation
    dep_flags: ""
    
    # Not applicable
    pic_flag: ""
    
    # Not applicable
    include_flag: ""
    
    # Not applicable
    define_flag: ""
  
  # Linking not applicable
  link:
    shared_library:
      command: ""
      output_pattern: ""
      pic_flag: ""
    
    static_library:
      command: ""
      output_pattern: ""
    
    executable:
      command: ""
      output_pattern: ""
    
    lib_dir_flag: ""
    lib_flag: ""
  
  # File extensions
  extensions:
    object: ".png"        # Default output format
    dependency: ""
    shared_library: ""
    static_library: ""
    executable: ""


