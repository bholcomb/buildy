toolchain:
  name: "docker-linux"
  description: "GCC in Docker for cross-platform builds"
  
  target:
    platform: linux
    architecture: x86_64
  
  host:
    platform: any
    architecture: any
  
  execution:
    type: docker
    image: "gcc:13"
    # Mount current directory into container
    volumes:
      - "${PWD}:/workspace"
    working_dir: "/workspace"
    # Run as current user to avoid permission issues
    user: "${UID}:${GID}"
  
  tools:
    c_compiler: gcc
    cxx_compiler: g++
    linker: g++
    archiver: ar
    strip: strip
    objcopy: objcopy
  
  compile:
    command: "{cxx_compiler} {dep_flags} -std={std} {flags} {defines} {pic} {includes} -c {input} -o {output}"
    
    flags:
      common: ["-Wall", "-Wextra"]
      debug: ["-g", "-O0"]
      release: ["-O3", "-DNDEBUG"]
    
    dep_flags: "-MMD -MP -MF {dep_file}"
    pic_flag: "-fPIC"
    include_flag: "-I"
    define_flag: "-D"
  
  link:
    shared_library:
      command: "{linker} -shared {pic} {objects} {lib_dirs} {libs} -o {output}"
      output_pattern: "lib{name}.so"
      pic_flag: "-fPIC"
    
    static_library:
      command: "{archiver} rcs {output} {objects}"
      output_pattern: "lib{name}.a"
    
    executable:
      command: "{linker} {objects} {lib_dirs} {libs} -o {output}"
      output_pattern: "{name}"
    
    lib_dir_flag: "-L"
    lib_flag: "-l"
  
  extensions:
    object: ".o"
    dependency: ".d"
    shared_library: ".so"
    static_library: ".a"
    executable: ""


