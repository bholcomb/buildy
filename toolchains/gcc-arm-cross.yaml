toolchain:
  name: "gcc-arm-cross"
  description: "GCC ARM cross-compiler for embedded systems"
  
  target:
    platform: linux
    architecture: arm
  
  host:
    platform: linux
    architecture: x86_64
  
  execution:
    type: native
  
  tools:
    c_compiler: arm-linux-gnueabihf-gcc
    cxx_compiler: arm-linux-gnueabihf-g++
    linker: arm-linux-gnueabihf-g++
    archiver: arm-linux-gnueabihf-ar
    strip: arm-linux-gnueabihf-strip
    objcopy: arm-linux-gnueabihf-objcopy
  
  compile:
    command: "{cxx_compiler} {dep_flags} -std={std} {flags} {defines} {pic} {includes} -c {input} -o {output}"
    
    flags:
      common: ["-Wall", "-Wextra"]
      debug: ["-g", "-O0"]
      release: ["-O3", "-DNDEBUG"]
    
    dep_flags: "-MMD -MP -MF {dep_file}"
    pic_flag: "-fPIC"
    include_flag: "-I"
    define_flag: "-D"
  
  link:
    shared_library:
      command: "{linker} -shared {pic} {objects} {lib_dirs} {libs} -o {output}"
      output_pattern: "lib{name}.so"
      pic_flag: "-fPIC"
    
    static_library:
      command: "{archiver} rcs {output} {objects}"
      output_pattern: "lib{name}.a"
    
    executable:
      command: "{linker} {objects} {lib_dirs} {libs} -o {output}"
      output_pattern: "{name}"
    
    lib_dir_flag: "-L"
    lib_flag: "-l"
  
  extensions:
    object: ".o"
    dependency: ".d"
    shared_library: ".so"
    static_library: ".a"
    executable: ""


