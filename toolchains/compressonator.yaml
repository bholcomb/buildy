toolchain:
  name: "compressonator"
  description: "AMD Compressonator CLI for texture compression (cross-platform)"
  
  target:
    platform: any
    architecture: any
  
  host:
    platform: any
    architecture: any
  
  execution:
    type: native
  
  tools:
    # Texture compression/conversion
    convert:
      action: convert
      command: "compressonatorcli {input} {output} {flags}"
      input_extensions: [".png", ".jpg", ".jpeg", ".tga", ".bmp", ".exr", ".hdr"]
      output_extension: ".dds"
      flags:
        common: ["-fd", "BC7"]
        debug: ["-fd", "BC7", "-Quality", "1.0"]
        release: ["-fd", "BC7", "-Quality", "0.8"]
      supports:
        defines: false
        includes: false
