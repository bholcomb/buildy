toolchain:
  name: "glslc"
  description: "Google shaderc glslc compiler for GLSL to SPIR-V"
  
  target:
    platform: any
    architecture: any
  
  host:
    platform: any
    architecture: any
  
  execution:
    type: native
  
  tools:
    # GLSL shader compilation
    compile:
      action: compile
      command: "glslc {flags} {defines} {includes} {input} -o {output}"
      input_extensions: [".vert", ".frag", ".comp", ".geom", ".tesc", ".tese", ".glsl"]
      output_extension: ".spv"
      flags:
        common: []
        debug: ["-g", "-O0"]
        release: ["-O"]
      supports:
        defines: true
        define_flag: "-D"
        includes: true
        include_flag: "-I"
        dependencies: false
