toolchain:
  name: "clang-macos"
  description: "Apple Clang for macOS"
  
  target:
    platform: macos
    architecture: arm64  # Apple Silicon
  
  host:
    platform: macos
    architecture: arm64
  
  execution:
    type: native
  
  tools:
    c_compiler: clang
    cxx_compiler: clang++
    linker: clang++
    archiver: ar
    strip: strip
    objcopy: objcopy
  
  compile:
    command: "{cxx_compiler} {dep_flags} -std={std} {flags} {defines} {pic} {includes} -c {input} -o {output}"
    
    flags:
      common: ["-Wall", "-Wextra"]
      debug: ["-g", "-O0"]
      release: ["-O3", "-DNDEBUG"]
    
    dep_flags: "-MMD -MP -MF {dep_file}"
    pic_flag: "-fPIC"
    include_flag: "-I"
    define_flag: "-D"
  
  link:
    shared_library:
      command: "{linker} -dynamiclib {objects} {lib_dirs} {libs} -o {output}"
      output_pattern: "lib{name}.dylib"
      pic_flag: ""
    
    static_library:
      command: "{archiver} rcs {output} {objects}"
      output_pattern: "lib{name}.a"
    
    executable:
      command: "{linker} {objects} {lib_dirs} {libs} -o {output}"
      output_pattern: "{name}"
    
    lib_dir_flag: "-L"
    lib_flag: "-l"
  
  extensions:
    object: ".o"
    dependency: ".d"
    shared_library: ".dylib"
    static_library: ".a"
    executable: ""

