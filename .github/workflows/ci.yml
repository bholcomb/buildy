# Vet, test and build buildy on Linux, Windows and macOS. A v* tag also
# publishes a GitHub release of each platform's binary.
#
# Each platform builds natively with the ldflags of bootstrap.sh. A tag's
# build also sets main.Version to the tag without its "v" (v0.2.0 -> 0.2.0)
# and is packaged as buildy-<version>-<rid>.tar.gz (.zip on Windows), with
# the binary, buildy or buildy.exe, at the archive's root.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports, even when another fails.
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
            archive: tar.gz
          - rid: win-x64
            os: windows-2025
            archive: zip
          - rid: osx-arm64
            os: macos-15
            archive: tar.gz
    defaults:
      run:
        shell: bash
    env:
      # A static binary: no C toolchain or libc version needed.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Vet
        working-directory: src
        run: go vet ./...

      - name: Test
        working-directory: src
        run: go test ./...

      # The version is the tag's on a tag, else the commit's.
      - name: Build
        run: |
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git_commit="$(git rev-parse --short HEAD)"
          ldflags="-X main.BuildTime=$build_time -X main.GitCommit=$git_commit -X main.BuildConfig=release -s -w"
          version="$git_commit"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            ldflags="$ldflags -X main.Version=$version"
          fi
          exe="buildy$(cd src && go env GOEXE)"
          mkdir -p dist/bin
          (cd src && go build -o "../dist/bin/$exe" -ldflags "$ldflags" .)
          help="$(dist/bin/$exe --help 2>&1)"
          echo "$help" | head -3
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && ! grep -qF "Buildy v$version " <<< "$help"; then
            echo "::error::dist/bin/$exe does not report version $version"
            exit 1
          fi
          echo "EXE=$exe" >> "$GITHUB_ENV"
          echo "ARCHIVE=buildy-$version-${{ matrix.rid }}.${{ matrix.archive }}" >> "$GITHUB_ENV"

      - name: Package
        working-directory: dist/bin
        run: |
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "../$ARCHIVE" "$EXE"
          else
            tar -czf "../$ARCHIVE" "$EXE"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildy-${{ matrix.rid }}
          path: dist/${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: buildy-*
          path: release
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: release
        run: |
          sha256sum buildy-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Buildy $GITHUB_REF_NAME" --generate-notes --verify-tag buildy-* SHA256SUMS
